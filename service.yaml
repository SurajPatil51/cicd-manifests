apiVersion: v1
kind: Service
metadata:
  name: spring-boot-app-service
  labels:
    app: spring-boot-app
spec:
  type: ClusterIP
  ports:
  - port: 8080          # The port the service exposes inside the cluster
    targetPort: 8080    # The port your Spring Boot app is listening on inside the container
    protocol: TCP
  selector:
    app: spring-boot-app